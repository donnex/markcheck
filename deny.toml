# `cargo deny check licenses` (#132) and `cargo deny check advisories` (#230),
# run on every push by check.yml and the advisories also weekly by
# advisories.yml: every dependency must be under a license listed here, the
# same list about.toml accepts for the release notices, and no locked crate
# version may have a RustSec advisory or be yanked.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
exclude-dev = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# An advisory accepted on purpose goes in `ignore` as
# `{ id = "RUSTSEC-YYYY-NNNN", reason = "..." }`, never without its reason.
[advisories]
yanked = "deny"
ignore = []
