name: Check

# Runs on every push and pull request: formatting, lint, and the full test
# suite must all pass before a change is considered clean, matching the
# checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Job-level, not step-level: this is a property of *this repository's
    # tests*, not of one invocation, and every step that executes the test
    # binaries needs it. `cargo llvm-cov` re-runs the whole suite and is easy
    # to miss precisely because it has no "test" in its name -- it used to
    # run the PTY tests fully parallel, i.e. in exactly the configuration the
    # comment below documents as unreliable, so an intermittent failure would
    # surface at a step labelled "coverage >= 97%" and read as a coverage
    # regression that wasn't one.
    #
    # RUST_TEST_THREADS=1: the PTY tests each spawn a real subprocess (some
    # with their own background commit+push thread, polling a bare remote for
    # it to land), and full default parallelism on GitHub's shared runners
    # starved that background thread's scheduling badly enough to blow even a
    # 90s poll deadline. Diagnostic timing showed the git operations
    # themselves are fast (~19ms) even in CI -- it's pure self-contention
    # from many concurrent PTY-spawning tests, not slow git commands. Serial
    # execution confirmed fast (~5s for the five git-sync tests alone) and
    # reliable. Local dev is unaffected (this only applies inside CI).
    env:
      RUST_TEST_THREADS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (coverage >= 97%, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 97 --fail-under-regions 97
