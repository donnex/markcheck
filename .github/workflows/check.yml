name: Check

# Runs on every push and pull request: formatting, lint, and the full test
# suite must all pass before a change is considered clean, matching the
# checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (coverage >= 97%, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 97 --fail-under-regions 97
