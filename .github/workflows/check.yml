name: Check

# Runs on every push and pull request: formatting, lint, and the full test
# suite must all pass before a change is considered clean, matching the
# checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      # RUST_TEST_THREADS caps parallelism: the git-sync PTY tests spawn a
      # subprocess with its own background commit+push thread and poll for
      # it to land, and GitHub's shared runners are contended enough that
      # running the full default parallelism (one thread per core) on top
      # of that regularly pushed those polls past even a 60s deadline.
      # Local dev is unaffected (this only applies inside CI).
      - name: cargo test
        run: cargo test --locked
        env:
          RUST_TEST_THREADS: 2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (coverage >= 97%, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 97 --fail-under-regions 97
