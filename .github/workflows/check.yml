name: Check

# Runs on every push and pull request: formatting, lint, and the full test
# suite must all pass before a change is considered clean, matching the
# checks CLAUDE.md requires before a commit. release.yml calls this same
# workflow (workflow_call) as its release gate, so there is exactly one
# definition of "clean".
#
# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment) and npm packages to exact versions, so a moved tag or a
# republished package can't change what runs here without a change in this
# repository. Every checkout sets `persist-credentials: false`: nothing here
# runs git against GitHub after checkout, and otherwise the job's token stays
# in the git config where any dependency's build script or proc macro could
# read it (#200).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No RUST_TEST_THREADS here: the PTY tests (tests/pty.rs) serialize
    # themselves with a lock each one holds while its binary runs, since many
    # concurrent PTY-spawning tests starved git-sync's background thread on
    # shared runners. That covers every step that runs them -- `cargo test`
    # and `cargo llvm-cov` alike -- and leaves the unit tests fully parallel.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      # Every dependency's license must be on deny.toml's list (#132).
      - name: cargo deny check licenses
        run: cargo deny check licenses

      # No locked crate version may have a RustSec advisory or be yanked
      # (#230). This also gates releases, since release.yml calls this
      # workflow; advisories.yml reruns it weekly, because a new advisory
      # needs no change here to appear.
      - name: cargo deny check advisories
        run: cargo deny check advisories

      # deny.toml's list is checked on every push, about.toml's only when
      # release.yml generates the license notices after a tag is pushed; a
      # license on one list but not the other would pass here and fail the
      # release (#203).
      - name: deny.toml and about.toml allow the same licenses
        run: |
          python3 -c '
          import sys, tomllib
          with open("deny.toml", "rb") as f:
              deny = set(tomllib.load(f)["licenses"]["allow"])
          with open("about.toml", "rb") as f:
              about = set(tomllib.load(f)["accepted"])
          if deny != about:
              for lic in sorted(deny - about):
                  print(f"::error::{lic} is allowed in deny.toml but not accepted in about.toml")
              for lic in sorted(about - deny):
                  print(f"::error::{lic} is accepted in about.toml but not allowed in deny.toml")
              sys.exit(1)
          print(f"deny.toml and about.toml allow the same {len(deny)} licenses")
          '

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: cargo llvm-cov (production coverage >= 97%, excluding main.rs and tests)
        run: |
          cargo llvm-cov --locked \
            --ignore-filename-regex 'main\.rs|_tests\.rs|test_support\.rs' \
            --fail-under-lines 97 --fail-under-regions 97

  # macOS is a supported platform with release binaries of its own (#194),
  # and its code paths differ from Linux's (no /proc, so `ps`; the system
  # pasteboard instead of X11/Wayland; `open` instead of `xdg-open`). Lint,
  # build and test it here; formatting, licenses, advisories and coverage
  # don't depend on the platform and stay in the Linux job. Tests that read
  # /proc already skip themselves where it doesn't exist.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # The PTY tests (tests/pty.rs) drive the compiled binary.
      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

  # Cargo.toml's rust-version is a promise to anyone building from source;
  # building with exactly that toolchain keeps it true (#44). The version is
  # read from the manifest rather than copied here, so changing rust-version
  # changes what this job builds with (#203).
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          if [ -z "$msrv" ] || [ "$msrv" = "null" ]; then
            echo "::error::Cargo.toml has no rust-version" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }} (Cargo.toml rust-version)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build with the minimum supported Rust
        run: cargo build --locked
