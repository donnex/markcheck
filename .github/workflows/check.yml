name: Check

# Runs on every push and pull request: formatting, lint, and the full test
# suite must all pass before a change is considered clean, matching the
# checks CLAUDE.md requires before a commit. release.yml calls this same
# workflow (workflow_call) as its release gate, so there is exactly one
# definition of "clean".
#
# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment) and npm packages to exact versions, so a moved tag or a
# republished package can't change what runs here without a change in this
# repository.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No RUST_TEST_THREADS here: the PTY tests (tests/pty.rs) serialize
    # themselves with a lock each one holds while its binary runs, since many
    # concurrent PTY-spawning tests starved git-sync's background thread on
    # shared runners. That covers every step that runs them -- `cargo test`
    # and `cargo llvm-cov` alike -- and leaves the unit tests fully parallel.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (coverage >= 97%, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 97 --fail-under-regions 97
