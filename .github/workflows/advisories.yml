name: Advisories

# check.yml runs `cargo deny check advisories` on every push, but a RustSec
# advisory against a crate in Cargo.lock can be published without any change
# to this repository. This reruns the same check, against the same deny.toml,
# weekly and on demand, so one is noticed even while nothing is pushed
# (#230). Actions are pinned to full commit SHAs, tools to exact versions,
# and the checkout keeps no credentials, as in check.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check advisories
        run: cargo deny check advisories
