# Third-party license notices for the release archive (#132), generated with
# `cargo about generate about.hbs` for the musl target the release builds.
# A dependency under a license not listed here fails the generation; the
# same list is enforced on every push by `cargo deny check licenses`
# (deny.toml).
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
