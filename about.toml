# Third-party license notices for the release archive (#132), generated with
# `cargo about generate --target <target> about.hbs` once per release
# target, so each archive lists the crates compiled into its own binary.
# A dependency under a license not listed here fails the generation; the
# same list is enforced on every push by `cargo deny check licenses`
# (deny.toml).
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The release targets, for a run without --target.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
